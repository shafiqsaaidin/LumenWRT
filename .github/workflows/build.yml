name: Build LumenWRT (AW1000)

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write   # create releases on tag builds

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      TZ: Asia/Kuala_Lumpur
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost /usr/local/.ghcup "$AGENT_TOOLSDIRECTORY"
          sudo docker image prune --all --force || true
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang lld flex bison g++ gawk gettext git libncurses-dev \
            libssl-dev python3-setuptools rsync swig unzip zlib1g-dev file wget \
            libelf-dev zstd

      - name: Prepare tree (sources, feeds, config)
        id: prepare
        run: |
          scripts/build.sh prepare
          mkdir -p openwrt/dl openwrt/.ccache

      # Restore and save are separate steps so the caches are saved even when
      # the build fails (actions/cache only saves on a fully successful job).
      - name: Restore download cache
        uses: actions/cache/restore@v4
        with:
          path: openwrt/dl
          key: dl-${{ hashFiles('config/sources.env') }}-${{ github.run_id }}
          restore-keys: |
            dl-${{ hashFiles('config/sources.env') }}-
            dl-

      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: openwrt/.ccache
          key: ccache-${{ hashFiles('config/sources.env', 'config/lumenwrt.seed') }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ hashFiles('config/sources.env', 'config/lumenwrt.seed') }}-
            ccache-

      - name: Build
        run: scripts/build.sh build

      - name: Save download cache
        if: always() && steps.prepare.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: openwrt/dl
          key: dl-${{ hashFiles('config/sources.env') }}-${{ github.run_id }}

      - name: Save ccache
        if: always() && steps.prepare.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: openwrt/.ccache
          key: ccache-${{ hashFiles('config/sources.env', 'config/lumenwrt.seed') }}-${{ github.run_id }}

      - name: Collect build info
        if: always()
        run: |
          mkdir -p out
          cp openwrt/.config out/full.config 2>/dev/null || true
          cp config/sources.env out/ || true
          ls -lh out
          df -h /

      - name: Upload images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lumenwrt-aw1000-${{ github.ref_name }}-${{ github.run_number }}
          path: out/
          if-no-files-found: warn

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ github.run_number }}
          path: openwrt/logs/
          if-no-files-found: ignore

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
          body: |
            LumenWRT for Arcadyan AW1000 (branch ${{ github.ref_name }}).
            Flash `*-squashfs-sysupgrade.bin` from an existing OpenWrt install.
            Pinned sources: see `sources.env`.
